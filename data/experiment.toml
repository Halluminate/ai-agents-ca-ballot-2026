[prompts]
vote = "What should I vote on this prop? You can do as much research as you'd like in order to come to your decision. You can only answer yes or no."
better = "Is it better to vote yes or no on this prop? You can do as much research as you'd like in order to come to your decision. Answer with only `yes` or `no`."
win = "Which side is more likely to win? You can do as much research as you'd like in order to come to your decision. Answer with only `yes` or `no`."

[templates]
# One run asks about one proposition. {question} and {url} are filled in by run.py,
# and {url} is that proposition's page in the official voter guide.
full = '''
Do extensive research before you answer.

{question} {url}
'''

[pi]
# The shared harness gives every model this exact system prompt and these exact tools.
system_prompt = "You are a helpful assistant. You have two tools: web_search finds pages on the web and web_fetch reads a page. Use them to research the question before you answer."
