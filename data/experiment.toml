# Everything you would want to change lives here. The keys live in .env: OpenRouter's for
# everything, plus OpenAI's for Codex and Google's for Gemini CLI.

[run]
repeats = 1            # runs per model x harness x prompt x proposition
seed = 20261103        # shuffles run order so time drift is not tied to one condition
concurrency = 14       # runs at once in total
per_model = 5          # runs at once for one model, across both harnesses
timeout_minutes = 90   # per run, on every harness. Haiku in Claude Code took up to 57 minutes in the test
retries = 2            # infrastructure failures only, never refusals or hedged answers
max_run_usd = 15       # per-run cap, enforced by Claude Code only
max_total_usd = 950    # no new runs start after spend passes this
# Providers that rate-limit get a cap across all their models: Alibaba lets about 3 runs at
# a time through.
per_provider = { alibaba = 4 }

[search]
# The shared harness's web_search runs on the OpenRouter key: one helper call with the
# web plugin and a fixed engine, whose results come back verbatim as citations. The
# helper's own text is thrown away, so no model chooses or summarizes the results.
engine = "perplexity"
helper_model = "mistralai/mistral-nemo"
# Search results and pages the shared harness has read are kept here, under runs/, for
# every run that uses this name, so models that make the same search read the same text.
# A new name starts with nothing saved.
cache = "web_cache_openrouter"

# Model ids are OpenRouter ids. pin is the OpenRouter provider every request is pinned
# to, with no fallback, where the harness allows it (Pi and Claude Code do; Grok Build
# cannot add the field, so its routing is recorded instead).
# native is the model's own agent harness, or "" where none runs here. Codex and Gemini CLI
# run on their vendor's own key, so they take the vendor's model id from native_model.
# Prices are USD per million tokens, each maker's own price. They are only used when a
# harness does not report its own cost. search is a vendor's fee per search, and
# cache_write its price per million tokens written to its cache.

[[models]]
name = "claude"
model = "anthropic/claude-opus-5.5"
pin = "anthropic"
native = "claude_code"
native_effort = "max"
pi_thinking = "max"
cheap_model = "anthropic/claude-haiku-5.5"
price = { input = 4.0, output = 20.0, cached = 0.20 }

[[models]]
name = "gpt"
model = "openai/gpt-6-astra"
pin = "openai"
native = "codex"
native_model = "gpt-6-astra"
native_cheap_model = "gpt-6-luna"
native_effort = "max"
pi_thinking = "max"
cheap_model = "openai/gpt-6-luna"
price = { input = 10.0, output = 50.0, cached = 1.0, cache_write = 12.5, search = 0.01 }

[[models]]
name = "gemini"
model = "google/gemini-4-argon"
pin = "google-ai-studio"
native = "gemini_cli"
native_model = "gemini-4-argon"
native_cheap_model = "gemini-3.8-flash"
native_effort = "high" # Gemini CLI has no effort setting: it always thinks at Gemini's highest level
pi_thinking = "max"    # Pi sends this to Gemini as "high", its highest level
cheap_model = "google/gemini-3.8-flash"
price = { input = 2.0, output = 10.0, cached = 0.10, search = 0.014 }

